<style>
/* =====================================================================
   WIMBO — Feuille de style (charte graphique 2026)
   Couleurs : Bordeaux #B10D3A · Corail #FF6B4A · Ivoire #F7EDE2
              Noir #18090D · Bordeaux nuit #35090F
   Typos    : Montserrat (titres) · Josefin Sans (sous-titres) · Inter (texte)
   ===================================================================== */
:root {
  --bordeaux: #B10D3A;
  --corail: #FF6B4A;
  --ivoire: #F7EDE2;
  --ivoire-2: #FBF6F0;
  --noir: #18090D;
  --nuit: #35090F;
  --grad: linear-gradient(120deg, #B10D3A 0%, #E2304A 55%, #FF6B4A 100%);
  --grad-soft: linear-gradient(135deg, rgba(177,13,58,.92), rgba(255,107,74,.9));
  --ink: #18090D;
  --ink-2: #5B4448;
  --ink-3: #8E7B7E;
  --line: #E8D9CB;
  --line-2: #F0E5DA;
  --card: #FFFCF9;
  --ok: #1F7A4D;
  --warn: #B26A00;
  --r-sm: 10px; --r: 16px; --r-lg: 24px; --r-full: 999px;
  --sh: 0 1px 2px rgba(53,9,15,.06), 0 8px 24px rgba(53,9,15,.08);
  --sh-lg: 0 18px 50px rgba(53,9,15,.18);
  --f-title: 'Montserrat', 'Arial Black', sans-serif;
  --f-sub: 'Josefin Sans', 'Futura', sans-serif;
  --f-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --wrap: 1200px;
  --header-h: 76px;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--ivoire); color: var(--ink);
  font-family: var(--f-body); font-weight: 400; font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--corail); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 24px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hide { display: none !important; }

/* ---------- Typographie ---------- */
h1, h2, h3, .t-title { font-family: var(--f-title); font-weight: 800; letter-spacing: -.01em; line-height: 1.12; margin: 0; }
h4, h5 { font-family: var(--f-sub); font-weight: 600; margin: 0; }
.eyebrow { font-family: var(--f-sub); font-weight: 600; font-size: 14px; letter-spacing: .2em; text-transform: uppercase; color: var(--bordeaux); display: block; margin-bottom: 12px; }
.on-dark .eyebrow { color: var(--corail); }
.h-xl { font-size: clamp(29px, 8.2vw, 72px); text-transform: uppercase; line-height: 1.02; }
.h-lg { font-size: clamp(28px, 3.6vw, 44px); }
.h-md { font-size: clamp(22px, 2.4vw, 30px); }
.sub { font-family: var(--f-sub); font-weight: 600; font-size: clamp(19px, 2vw, 24px); line-height: 1.35; }
.lead { font-size: 18px; color: var(--ink-2); font-weight: 300; max-width: 640px; }
.on-dark .lead, .hero .lead, .page-hero .lead, .auth-side .lead, .founders .lead { color: rgba(247,237,226,.84); }
.muted { color: var(--ink-3); }
.small { font-size: 14px; }
.tiny { font-size: 12.5px; }
.accent { color: var(--corail); }
.grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

/* ---------- Boutons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 24px; border-radius: var(--r-full); border: 1.5px solid transparent; font-weight: 600; font-size: 15.5px; line-height: 1.2; transition: transform .15s, box-shadow .2s, background .2s, color .2s; white-space: nowrap; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--grad); color: #fff; box-shadow: 0 6px 18px rgba(177,13,58,.28); }
.btn-primary:hover { box-shadow: 0 10px 26px rgba(177,13,58,.38); transform: translateY(-1px); }
.btn-dark { background: var(--nuit); color: var(--ivoire); }
.btn-dark:hover { background: var(--noir); }
.btn-light { background: var(--ivoire); color: var(--nuit); }
.btn-light:hover { background: #fff; }
.btn-ghost { background: transparent; border-color: currentColor; }
.btn-ghost:hover { background: rgba(53,9,15,.06); }
.on-dark .btn-ghost:hover { background: rgba(247,237,226,.1); }
.btn-sm { padding: 9px 16px; font-size: 14px; }
.btn-lg { padding: 16px 30px; font-size: 16.5px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .55; pointer-events: none; }
.link { color: var(--bordeaux); font-weight: 600; border-bottom: 1.5px solid rgba(177,13,58,.25); }
.link:hover { border-color: var(--bordeaux); }
.on-dark .link { color: var(--corail); border-color: rgba(255,107,74,.35); }
.icon { width: 20px; height: 20px; flex: none; }
.icon-sm { width: 16px; height: 16px; flex: none; }

/* ---------- Header ---------- */
.site-header { position: sticky; top: 0; z-index: 60; background: rgba(24,9,13,.96); backdrop-filter: blur(10px); color: var(--ivoire); border-bottom: 1px solid rgba(247,237,226,.08); }
.site-header .wrap { display: flex; align-items: center; height: var(--header-h); gap: 20px; }
.logo { display: flex; align-items: center; flex: none; }
.logo img { height: 38px; width: auto; }
.nav { display: flex; gap: 4px; align-items: center; flex: 1; }
.nav > .nav-item { position: relative; }
.nav-link { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; padding: 10px 14px; border-radius: var(--r-full); font-size: 15px; font-weight: 500; color: rgba(247,237,226,.88); background: none; border: 0; }
.nav-link:hover, .nav-link.active { color: #fff; background: rgba(247,237,226,.08); }
.nav-link svg { width: 14px; height: 14px; opacity: .7; }
.mega { position: absolute; top: calc(100% + 10px); left: -10px; min-width: 560px; background: var(--card); color: var(--ink); border-radius: var(--r); box-shadow: var(--sh-lg); padding: 22px 24px; display: none; z-index: 70; }
.mega::before { content: ''; position: absolute; top: -12px; left: 0; right: 0; height: 12px; }
.nav-item:hover .mega, .nav-item:focus-within .mega { display: block; }
.mega-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 18px; }
.mega a { display: block; padding: 7px 10px; border-radius: 8px; font-size: 14.5px; color: var(--ink-2); }
.mega a:hover { background: var(--ivoire); color: var(--bordeaux); }
.mega .mega-foot { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-2); font-size: 14px; }
.header-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.header-right .btn-ghost { color: var(--ivoire); border-color: rgba(247,237,226,.35); }
.user-btn { display: flex; align-items: center; gap: 10px; padding: 5px 6px 5px 14px; border-radius: var(--r-full); border: 1px solid rgba(247,237,226,.25); background: none; color: var(--ivoire); font-size: 14px; font-weight: 500; }
.avatar-i { width: 32px; height: 32px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; font-family: var(--f-title); font-weight: 800; font-size: 13px; }
.dropdown { position: absolute; right: 0; top: calc(100% + 8px); background: var(--card); color: var(--ink); border-radius: var(--r); box-shadow: var(--sh-lg); min-width: 250px; padding: 8px; z-index: 80; }
.dropdown a, .dropdown button { display: flex; width: 100%; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 8px; font-size: 14.5px; background: none; border: 0; text-align: left; }
.dropdown a:hover, .dropdown button:hover { background: var(--ivoire); }
.dropdown .dd-head { padding: 10px 12px 12px; border-bottom: 1px solid var(--line-2); margin-bottom: 6px; }
.dropdown .dd-head strong { display: block; font-size: 15px; }
.burger { display: none; background: none; border: 0; color: var(--ivoire); padding: 8px; margin-left: auto; }
.burger svg { width: 26px; height: 26px; }
.drawer { position: fixed; inset: 0; z-index: 90; display: none; }
.drawer.open { display: block; }
.drawer-bg { position: absolute; inset: 0; background: rgba(24,9,13,.55); }
.drawer-panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(360px, 88vw); background: var(--noir); color: var(--ivoire); padding: 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.drawer-panel .logo img { height: 32px; }
.drawer-panel a.dl { padding: 12px 6px; border-bottom: 1px solid rgba(247,237,226,.08); font-size: 16px; }
.drawer-panel details summary { padding: 12px 6px; border-bottom: 1px solid rgba(247,237,226,.08); cursor: pointer; list-style: none; font-size: 16px; }
.drawer-panel details a { display: block; padding: 8px 16px; font-size: 14.5px; color: rgba(247,237,226,.75); }

/* ---------- Sections ---------- */
.section { padding: 96px 0; }
.section-sm { padding: 64px 0; }
.section.ivory-2 { background: var(--ivoire-2); }
.section.dark, .dark { background: var(--noir); color: var(--ivoire); }
.section.nuit { background: var(--nuit); color: var(--ivoire); }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 40px; flex-wrap: wrap; }
.section-head .lead { margin-top: 12px; }
.center { text-align: center; }
.center .lead { margin-left: auto; margin-right: auto; }

/* ---------- Hero accueil ---------- */
.hero { position: relative; color: var(--ivoire); background: var(--nuit); overflow: hidden; }
.hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center 35%; }
.hero-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, rgba(24,9,13,.94) 0%, rgba(53,9,15,.86) 42%, rgba(177,13,58,.45) 75%, rgba(255,107,74,.25) 100%); }
.hero-shape { position: absolute; right: -140px; bottom: -220px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #FFB27A 0%, #FF6B4A 35%, #B10D3A 75%, #35090F 100%); opacity: .55; filter: blur(2px); }
.hero-inner { position: relative; z-index: 2; padding-top: 84px; padding-bottom: 96px; }
.hero-tabs { display: inline-flex; background: rgba(247,237,226,.08); border: 1px solid rgba(247,237,226,.14); border-radius: var(--r-full); padding: 5px; margin-bottom: 30px; }
.hero-tabs button { border: 0; background: none; color: rgba(247,237,226,.75); padding: 9px 20px; border-radius: var(--r-full); font-weight: 600; font-size: 14.5px; }
.hero-tabs button.on { background: var(--ivoire); color: var(--nuit); }
.hero h1 .accent { display: block; }
.hero .sub { margin: 22px 0 10px; color: var(--ivoire); }
.hero .lead { margin: 0 0 34px; }
.searchbar { display: grid; grid-template-columns: 1.1fr 1.1fr 1fr auto; background: var(--card); border-radius: 22px; padding: 8px; gap: 0; box-shadow: var(--sh-lg); max-width: 980px; color: var(--ink); }
.searchbar .sf { padding: 8px 18px; border-right: 1px solid var(--line-2); display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.searchbar .sf:nth-last-child(2) { border-right: 0; }
.searchbar label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.searchbar select, .searchbar input { border: 0; background: transparent; padding: 3px 0; font-size: 15.5px; font-weight: 500; width: 100%; outline: none; color: var(--ink); appearance: none; -webkit-appearance: none; text-overflow: ellipsis; }
.searchbar .btn { border-radius: 16px; padding: 0 28px; min-height: 58px; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; align-items: center; }
.quick span { font-size: 14px; color: rgba(247,237,226,.7); margin-right: 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--r-full); font-size: 14px; font-weight: 500; border: 1px solid var(--line); background: var(--card); color: var(--ink-2); transition: all .15s; }
.chip:hover { border-color: var(--bordeaux); color: var(--bordeaux); }
.chip.on { background: var(--nuit); color: var(--ivoire); border-color: var(--nuit); }
.on-dark .chip, .hero .chip { background: rgba(247,237,226,.08); border-color: rgba(247,237,226,.2); color: var(--ivoire); }
.on-dark .chip:hover, .hero .chip:hover { background: rgba(247,237,226,.16); color: #fff; }
.artist-tab-panel { max-width: 620px; }
.artist-tab-panel ul { list-style: none; padding: 0; margin: 0 0 30px; display: grid; gap: 12px; }
.artist-tab-panel li { display: flex; gap: 12px; align-items: flex-start; color: rgba(247,237,226,.88); }
.artist-tab-panel li svg { color: var(--corail); margin-top: 3px; }

/* ---------- Bandeau promesses (stats) ---------- */
.promises { background: var(--card); border-bottom: 1px solid var(--line-2); }
.promises .wrap { display: grid; grid-template-columns: repeat(4, 1fr); }
.promise { padding: 34px 20px; text-align: center; border-right: 1px solid var(--line-2); }
.promise:last-child { border-right: 0; }
.promise .num { font-family: var(--f-title); font-weight: 800; font-size: 38px; line-height: 1; background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.promise .lbl { font-family: var(--f-sub); font-weight: 600; text-transform: uppercase; letter-spacing: .12em; font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.intro-line { text-align: center; max-width: 820px; margin: 0 auto; font-family: var(--f-sub); font-weight: 600; font-size: 22px; line-height: 1.45; color: var(--nuit); }

/* ---------- Cartes artistes ---------- */
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 26px; }
.card-a { position: relative; background: var(--card); border-radius: var(--r); overflow: hidden; box-shadow: var(--sh); transition: transform .25s, box-shadow .25s; display: flex; flex-direction: column; }
.card-a:hover { transform: translateY(-5px); box-shadow: var(--sh-lg); }
.card-a .ph { position: relative; aspect-ratio: 4/3.4; overflow: hidden; background: var(--grad); }
.card-a .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
.card-a:hover .ph img { transform: scale(1.05); }
.ph-tint::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(53,9,15,0) 55%, rgba(53,9,15,.55) 100%); pointer-events: none; }
.badge { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; padding: 5px 10px; border-radius: var(--r-full); font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.badge-prem { background: var(--grad); color: #fff; }
.badge-ver { background: rgba(255,252,249,.94); color: var(--nuit); }
.badge-soft { background: var(--ivoire); color: var(--nuit); }
.badge-ok { background: #E3F3EA; color: var(--ok); }
.badge-warn { background: #FFF1DC; color: var(--warn); }
.badge-no { background: #F6E1E1; color: #A02626; }
.card-a .badges { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; z-index: 2; }
.fav { position: absolute; top: 10px; right: 10px; z-index: 3; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,252,249,.94); display: grid; place-items: center; color: var(--nuit); transition: transform .15s; }
.fav:hover { transform: scale(1.08); }
.fav svg { width: 19px; height: 19px; }
.fav.on { color: var(--bordeaux); }
.fav.on svg { fill: var(--bordeaux); }
.card-a .bd { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.card-a h3 { font-size: 18px; }
.card-a .tg { font-size: 14px; color: var(--ink-2); }
.card-a .meta { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line-2); font-size: 13.5px; color: var(--ink-3); gap: 8px; }
.card-a .meta .pr { font-weight: 700; color: var(--ink); font-size: 14.5px; white-space: nowrap; }
.card-a .loc { display: flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 13.5px; color: var(--ink-3); }
.stars { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); font-weight: 600; }
.stars svg { width: 15px; height: 15px; color: var(--corail); fill: var(--corail); }

/* Carrousel */
.carousel { position: relative; }
.track { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 3 * 24px) / 4); gap: 24px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 6px 2px 24px; }
.track::-webkit-scrollbar { display: none; }
.track > * { scroll-snap-align: start; }
.car-btns { display: flex; gap: 10px; }
.car-btn { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--nuit); }
.car-btn:hover { border-color: var(--nuit); }
.on-dark .car-btn { background: transparent; border-color: rgba(247,237,226,.25); color: var(--ivoire); }

/* ---------- Étapes ---------- */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; counter-reset: st; }
.step { background: var(--card); border-radius: var(--r-lg); padding: 34px 30px; position: relative; box-shadow: var(--sh); }
.step .st-n { font-family: var(--f-sub); font-weight: 600; letter-spacing: .2em; font-size: 13px; color: var(--bordeaux); text-transform: uppercase; }
.step .st-ic { width: 60px; height: 60px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; color: #fff; margin: 16px 0 18px; box-shadow: 0 10px 24px rgba(177,13,58,.28); }
.step .st-ic svg { width: 26px; height: 26px; }
.step h3 { font-size: 20px; margin-bottom: 8px; }
.step p { margin: 0; color: var(--ink-2); font-size: 15.5px; }
.dark .step, .nuit .step { background: rgba(247,237,226,.05); box-shadow: none; border: 1px solid rgba(247,237,226,.1); }
.dark .step p, .nuit .step p { color: rgba(247,237,226,.75); }

/* ---------- Événements ---------- */
.ev-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.ev-card { position: relative; border-radius: var(--r-lg); overflow: hidden; min-height: 360px; display: flex; align-items: flex-end; color: var(--ivoire); background: var(--nuit); }
.ev-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .7s; }
.ev-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(24,9,13,.05) 20%, rgba(24,9,13,.88) 100%); }
.ev-card:hover img { transform: scale(1.05); }
.ev-card .ev-bd { position: relative; z-index: 2; padding: 26px; }
.ev-card h3 { font-size: 22px; margin-bottom: 8px; }
.ev-card p { margin: 0 0 14px; font-size: 14.5px; color: rgba(247,237,226,.82); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ev-card .more { font-weight: 600; color: var(--corail); display: inline-flex; gap: 6px; align-items: center; font-size: 14.5px; }
.ev-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
.ev-tile { position: relative; border-radius: var(--r); overflow: hidden; aspect-ratio: 4/3; color: var(--ivoire); display: flex; align-items: flex-end; padding: 16px; background: var(--nuit); }
.ev-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ev-tile::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(24,9,13,.85)); }
.ev-tile span { position: relative; z-index: 2; font-family: var(--f-title); font-weight: 800; font-size: 17px; }
.ev-tile small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 13px; opacity: .8; }

/* ---------- Pourquoi Wimbo (dark) ---------- */
.why { position: relative; overflow: hidden; }
.why .shape-a { position: absolute; left: -180px; top: -120px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle at 70% 70%, #FF6B4A, #B10D3A 60%, transparent 72%); opacity: .35; }
.why .shape-b { position: absolute; right: -60px; bottom: -60px; width: 260px; height: 520px; border-radius: 260px 0 0 260px; background: linear-gradient(180deg, #FF6B4A, #B10D3A); opacity: .25; }
.why-grid { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
.why-item { padding: 28px 24px; border-radius: var(--r); background: rgba(247,237,226,.05); border: 1px solid rgba(247,237,226,.1); }
.why-item .wi { width: 48px; height: 48px; border-radius: 14px; background: var(--grad); display: grid; place-items: center; color: #fff; margin-bottom: 18px; }
.why-item h3 { font-size: 18px; margin-bottom: 8px; }
.why-item p { margin: 0; font-size: 15px; color: rgba(247,237,226,.75); }

/* ---------- Avis ---------- */
.rv-card { background: var(--card); border-radius: var(--r); padding: 26px; box-shadow: var(--sh); display: flex; flex-direction: column; gap: 12px; }
.rv-card .q { font-size: 15.5px; color: var(--ink-2); margin: 0; flex: 1; }
.rv-who { display: flex; align-items: center; gap: 12px; }
.rv-who .avatar-i { width: 40px; height: 40px; font-size: 14px; color: #fff; flex: none; }
.rv-who strong { display: block; font-size: 15px; }
.rv-who span { font-size: 13px; color: var(--ink-3); }
.rv-stars { display: flex; gap: 2px; }
.rv-stars svg { width: 16px; height: 16px; color: var(--corail); fill: var(--corail); }
.rv-stars svg.off { fill: none; color: var(--line); }

/* ---------- CTA artiste ---------- */
.cta-band { background: var(--corail); color: var(--nuit); position: relative; overflow: hidden; }
.cta-band .wrap { display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: center; padding-top: 80px; padding-bottom: 80px; position: relative; z-index: 2; }
.cta-band h2 { font-size: clamp(30px, 4vw, 48px); text-transform: uppercase; }
.cta-band p { font-size: 18px; margin: 16px 0 0; color: rgba(53,9,15,.85); }
.cta-band .ctas { display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; }
.cta-band .circle { position: absolute; right: -100px; top: -160px; width: 440px; height: 440px; border-radius: 50%; background: var(--nuit); opacity: .12; }

/* ---------- Blog ---------- */
.blog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
.bl-card { background: var(--card); border-radius: var(--r); overflow: hidden; box-shadow: var(--sh); display: flex; flex-direction: column; transition: transform .25s; }
.bl-card:hover { transform: translateY(-4px); }
.bl-card .ph { aspect-ratio: 16/10; overflow: hidden; background: var(--grad); }
.bl-card .ph img { width: 100%; height: 100%; object-fit: cover; }
.bl-card .bd { padding: 20px 22px 24px; display: flex; flex-direction: column; gap: 8px; }
.bl-card .cat { font-family: var(--f-sub); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--bordeaux); }
.bl-card h3 { font-size: 19px; }
.bl-card p { margin: 0; font-size: 14.5px; color: var(--ink-2); }
.article { max-width: 760px; margin: 0 auto; }
.article .cover { border-radius: var(--r-lg); overflow: hidden; aspect-ratio: 16/8; margin: 30px 0 40px; background: var(--grad); }
.article .cover img { width: 100%; height: 100%; object-fit: cover; }
.prose { font-size: 17px; line-height: 1.75; color: var(--ink-2); font-weight: 300; }
.prose h3 { font-size: 22px; color: var(--ink); margin: 36px 0 12px; }
.prose strong { font-weight: 600; color: var(--ink); }
.prose ul { padding-left: 20px; }
.prose li { margin-bottom: 8px; }
.prose a { color: var(--bordeaux); font-weight: 500; text-decoration: underline; }
.prose .note { font-size: 14px; padding: 14px 18px; background: var(--ivoire-2); border-radius: var(--r-sm); border-left: 3px solid var(--corail); }

/* ---------- Offre musicale (index) ---------- */
.offer-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
.offer-cols h3 { font-size: 18px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid var(--line); }
.offer-cols ul { list-style: none; padding: 0; margin: 0; columns: 2; column-gap: 18px; }
.offer-cols li { break-inside: avoid; }
.offer-cols a { display: block; padding: 5px 0; color: var(--ink-2); font-size: 14.5px; }
.offer-cols a:hover { color: var(--bordeaux); }
.offer-cols a small { color: var(--ink-3); }

/* ---------- Footer ---------- */
.site-footer { background: var(--noir); color: rgba(247,237,226,.78); padding: 72px 0 0; }
.foot-top { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 40px; padding-bottom: 50px; border-bottom: 1px solid rgba(247,237,226,.1); }
.foot-brand img { height: 46px; width: auto; }
.foot-brand .tagline { font-family: var(--f-sub); font-weight: 300; letter-spacing: .32em; font-size: 12.5px; text-transform: uppercase; color: var(--ivoire); margin: 16px 0 14px; }
.foot-brand p { font-size: 14.5px; margin: 0 0 20px; max-width: 320px; }
.socials { display: flex; gap: 10px; }
.socials a { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(247,237,226,.2); display: grid; place-items: center; color: var(--ivoire); }
.socials a:hover { background: var(--grad); border-color: transparent; }
.socials svg { width: 18px; height: 18px; }
.site-footer h4 { color: var(--ivoire); font-size: 16px; margin-bottom: 16px; letter-spacing: .04em; }
.site-footer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; font-size: 14.5px; }
.site-footer ul a:hover { color: var(--corail); }
.foot-countries { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 26px 0; border-bottom: 1px solid rgba(247,237,226,.1); font-size: 14px; }
.foot-countries a { display: inline-flex; gap: 8px; align-items: center; }
.foot-countries a:hover { color: var(--corail); }
.foot-bottom { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 22px 0 30px; font-size: 13px; color: rgba(247,237,226,.5); }

/* ---------- Pages internes ---------- */
.page-hero { background: var(--nuit); color: var(--ivoire); position: relative; overflow: hidden; }
.page-hero .wrap { position: relative; z-index: 2; padding-top: 70px; padding-bottom: 70px; }
.page-hero .ph-bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: .38; }
.page-hero::after { content: ''; position: absolute; right: -120px; top: -120px; width: 380px; height: 380px; border-radius: 50%; background: var(--grad); opacity: .35; }
.page-hero .lead { margin-top: 14px; }
.crumbs { font-size: 13.5px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 18px; }
.crumbs a:hover { color: var(--bordeaux); }
.on-dark .crumbs, .page-hero .crumbs { color: rgba(247,237,226,.65); }
.box { background: var(--card); border-radius: var(--r); padding: 28px; box-shadow: var(--sh); }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; }

/* ---------- Recherche ---------- */
.search-top { background: var(--noir); color: var(--ivoire); padding: 26px 0; }
.search-top .searchbar { box-shadow: none; max-width: none; }
.results-layout { display: grid; grid-template-columns: 280px 1fr; gap: 34px; padding-top: 40px; padding-bottom: 90px; align-items: start; }
.filters { position: sticky; top: calc(var(--header-h) + 20px); background: var(--card); border-radius: var(--r); padding: 22px; box-shadow: var(--sh); max-height: calc(100vh - var(--header-h) - 40px); overflow-y: auto; }
.filters h4 { font-family: var(--f-title); font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; margin: 22px 0 10px; }
.filters h4:first-of-type { margin-top: 0; }
.filters .fhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.filters .fhead strong { font-family: var(--f-title); font-weight: 800; font-size: 18px; }
.ck { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 14.5px; color: var(--ink-2); cursor: pointer; }
.ck input { width: 18px; height: 18px; accent-color: var(--bordeaux); flex: none; }
.ck .cnt { margin-left: auto; font-size: 12.5px; color: var(--ink-3); }
.filters select, .filters input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: #fff; font-size: 14.5px; }
.filters input[type=range] { width: 100%; accent-color: var(--bordeaux); }
.more-btn { background: none; border: 0; padding: 4px 0; color: var(--bordeaux); font-weight: 600; font-size: 14px; }
.res-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.res-head h1 { font-size: 24px; }
.res-head select { padding: 10px 14px; border-radius: var(--r-full); border: 1px solid var(--line); background: var(--card); font-size: 14.5px; }
.active-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.active-filters .chip { cursor: pointer; }
.empty { text-align: center; padding: 60px 20px; background: var(--card); border-radius: var(--r); }
.empty .em-ic { width: 70px; height: 70px; border-radius: 50%; background: var(--ivoire); display: grid; place-items: center; margin: 0 auto 18px; color: var(--bordeaux); }
.filters-toggle { display: none; }

/* ---------- Fiche artiste ---------- */
.pf-cover { position: relative; height: 400px; background: var(--nuit); overflow: hidden; }
.pf-cover img { width: 100%; height: 100%; object-fit: cover; }
.pf-cover::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(24,9,13,.1) 0%, rgba(53,9,15,.15) 55%, rgba(177,13,58,.45) 100%); }
.pf-head { position: relative; margin-top: -85px; z-index: 3; display: flex; gap: 26px; align-items: flex-start; color: var(--ink); }
.pf-avatar { width: 170px; height: 170px; border-radius: 50%; border: 5px solid var(--ivoire); overflow: hidden; flex: none; background: var(--grad); box-shadow: var(--sh-lg); }
.pf-avatar img { width: 100%; height: 100%; object-fit: cover; }
.pf-title { padding-top: 100px; flex: 1; min-width: 0; }
.pf-title h1 { font-size: clamp(28px, 4vw, 44px); }
.pf-title .tg { font-family: var(--f-sub); font-weight: 600; font-size: 19px; margin-top: 6px; }
.pf-title .row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 10px; font-size: 14.5px; }
.pf-title .stars { color: var(--ink); }
.pf-actions { display: flex; gap: 10px; padding-top: 100px; }
.pf-actions .btn { color: var(--nuit); border-color: var(--line); background: var(--card); }
.pf-tabs { position: sticky; top: var(--header-h); z-index: 20; background: rgba(247,237,226,.96); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); margin-top: 30px; }
.pf-tabs .wrap { display: flex; gap: 6px; overflow-x: auto; }
.pf-tabs a { padding: 16px 16px 14px; font-weight: 600; font-size: 15px; color: var(--ink-2); border-bottom: 3px solid transparent; white-space: nowrap; }
.pf-tabs a:hover, .pf-tabs a.on { color: var(--bordeaux); border-color: var(--bordeaux); }
.pf-tabs a small { color: var(--ink-3); font-weight: 500; }
.pf-layout { display: grid; grid-template-columns: 1fr 380px; gap: 44px; padding-top: 40px; padding-bottom: 80px; align-items: start; }
.pf-layout > .book-col { align-self: stretch; }
.pf-block { background: var(--card); border-radius: var(--r); padding: 30px; box-shadow: var(--sh); margin-bottom: 24px; scroll-margin-top: calc(var(--header-h) + 70px); }
.pf-block > h2 { font-size: 22px; margin-bottom: 18px; }
.pf-block h4 { font-size: 17px; margin: 22px 0 6px; color: var(--nuit); }
.pf-block p { margin: 0 0 10px; color: var(--ink-2); font-weight: 300; font-size: 16px; }
.info-list { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; }
.info-list > div { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; }
.info-list svg { color: var(--bordeaux); margin-top: 2px; }
.info-list span { color: var(--ink-3); display: block; font-size: 13px; }
.members { display: grid; gap: 10px; }
.members div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 16px; background: var(--ivoire-2); border-radius: var(--r-sm); font-size: 15px; }
.members span { color: var(--ink-3); text-align: right; }
.price-big { font-family: var(--f-title); font-weight: 800; font-size: 30px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.gallery button { border: 0; padding: 0; border-radius: 12px; overflow: hidden; aspect-ratio: 1; background: var(--grad); }
.gallery img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
.gallery button:hover img { transform: scale(1.05); }
.videos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.video { position: relative; border: 0; padding: 0; border-radius: 14px; overflow: hidden; aspect-ratio: 16/9; background: var(--nuit); color: var(--ivoire); text-align: left; }
.video img { width: 100%; height: 100%; object-fit: cover; opacity: .7; }
.video .play { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; box-shadow: 0 8px 20px rgba(0,0,0,.3); }
.video .play svg { width: 24px; height: 24px; fill: #fff; margin-left: 3px; }
.video .vt { position: absolute; left: 14px; right: 14px; bottom: 10px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; gap: 10px; }
.rating-sum { display: grid; grid-template-columns: 170px 1fr; gap: 30px; align-items: center; padding-bottom: 24px; margin-bottom: 10px; border-bottom: 1px solid var(--line-2); }
.rating-sum .big { font-family: var(--f-title); font-weight: 800; font-size: 54px; line-height: 1; }
.crit { display: grid; grid-template-columns: 160px 1fr 34px; gap: 12px; align-items: center; font-size: 14px; color: var(--ink-2); margin: 6px 0; }
.bar { height: 7px; background: var(--line-2); border-radius: 9px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--grad); border-radius: 9px; }
.review { padding: 22px 0; border-bottom: 1px solid var(--line-2); }
.review:last-child { border-bottom: 0; }
.review .rh { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.review .rh strong { font-size: 15.5px; }
.review .rh span { font-size: 13.5px; color: var(--ink-3); }
.review p { margin: 6px 0; font-size: 15.5px; }
.review .reply { margin-top: 12px; padding: 14px 16px; background: var(--ivoire-2); border-radius: var(--r-sm); border-left: 3px solid var(--bordeaux); font-size: 14.5px; }
.review .reply strong { display: block; font-size: 13.5px; margin-bottom: 4px; color: var(--nuit); }
.book { position: sticky; top: calc(var(--header-h) + 74px); background: var(--card); border-radius: var(--r-lg); box-shadow: var(--sh-lg); padding: 26px; border-top: 5px solid var(--bordeaux); }
.book .from { font-size: 14px; color: var(--ink-3); }
.book .from strong { font-family: var(--f-title); font-weight: 800; font-size: 28px; color: var(--ink); }
.book .reassure { display: grid; gap: 8px; margin-top: 16px; font-size: 13.5px; color: var(--ink-2); }
.book .reassure div { display: flex; gap: 8px; align-items: center; }
.book .reassure svg { color: var(--ok); }
.mobile-book { display: none; }

/* ---------- Formulaires ---------- */
.form { display: grid; gap: 14px; }
.form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld label { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.fld label .opt { font-weight: 400; color: var(--ink-3); }
.fld input, .fld select, .fld textarea { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: #fff; font-size: 15px; transition: border-color .15s; }
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--bordeaux); outline: none; box-shadow: 0 0 0 4px rgba(177,13,58,.1); }
.fld textarea { min-height: 110px; resize: vertical; }
.fld .hint { font-size: 12.5px; color: var(--ink-3); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink-2); }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--bordeaux); flex: none; }
.alert { padding: 12px 16px; border-radius: var(--r-sm); font-size: 14.5px; }
.alert-err { background: #FBE4E6; color: #8E0F2C; }
.alert-ok { background: #E3F3EA; color: var(--ok); }
.alert-info { background: var(--ivoire-2); color: var(--ink-2); border-left: 3px solid var(--corail); }
.auth-wrap { min-height: calc(100vh - var(--header-h)); display: grid; grid-template-columns: 1fr 1fr; }
.auth-side { position: relative; background: var(--nuit); color: var(--ivoire); overflow: hidden; display: flex; align-items: flex-end; padding: 60px; }
.auth-side img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .45; }
.auth-side::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(53,9,15,.2), rgba(24,9,13,.92)); }
.auth-side .in { position: relative; z-index: 2; max-width: 460px; }
.auth-main { display: flex; align-items: center; justify-content: center; padding: 50px 24px; }
.auth-card { width: 100%; max-width: 480px; }
.auth-card h1 { font-size: 32px; margin-bottom: 8px; }
.wizard-steps { display: flex; gap: 8px; margin: 18px 0 26px; }
.wizard-steps div { flex: 1; height: 5px; border-radius: 6px; background: var(--line); }
.wizard-steps div.on { background: var(--grad); }
.photo-slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.photo-slot { aspect-ratio: 1; border-radius: 12px; border: 2px dashed var(--line); background: var(--ivoire-2); display: grid; place-items: center; cursor: pointer; overflow: hidden; position: relative; color: var(--ink-3); }
.photo-slot img { width: 100%; height: 100%; object-fit: cover; }
.photo-slot .rm { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; background: rgba(24,9,13,.75); color: #fff; border: 0; font-size: 14px; line-height: 1; }
.pick-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pick-chips .chip { cursor: pointer; }

/* ---------- Espaces (dashboards) ---------- */
.dash { display: grid; grid-template-columns: 250px 1fr; gap: 34px; padding-top: 40px; padding-bottom: 90px; align-items: start; }
.dash-nav { position: sticky; top: calc(var(--header-h) + 20px); background: var(--card); border-radius: var(--r); padding: 12px; box-shadow: var(--sh); display: grid; gap: 2px; }
.dash-nav a { display: flex; gap: 10px; align-items: center; padding: 11px 14px; border-radius: 10px; font-size: 15px; color: var(--ink-2); font-weight: 500; }
.dash-nav a:hover { background: var(--ivoire); }
.dash-nav a.on { background: var(--nuit); color: var(--ivoire); }
.dash-nav .cnt { margin-left: auto; background: var(--corail); color: #fff; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 10px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 24px; }
.kpi { background: var(--card); border-radius: var(--r); padding: 22px; box-shadow: var(--sh); }
.kpi span { font-size: 13.5px; color: var(--ink-3); }
.kpi strong { display: block; font-family: var(--f-title); font-weight: 800; font-size: 28px; margin-top: 6px; }
.req { background: var(--card); border-radius: var(--r); padding: 22px; box-shadow: var(--sh); margin-bottom: 16px; display: grid; gap: 10px; }
.req .rq-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.req .rq-h strong { font-size: 17px; }
.req .rq-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: var(--ink-2); }
.req .rq-meta span { display: inline-flex; gap: 6px; align-items: center; }
.req .rq-msg { font-size: 15px; color: var(--ink-2); background: var(--ivoire-2); padding: 12px 14px; border-radius: var(--r-sm); margin: 0; }
.req .rq-act { display: flex; gap: 8px; flex-wrap: wrap; }
.table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.table th { text-align: left; font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); padding: 10px 12px; border-bottom: 1px solid var(--line); }
.table td { padding: 14px 12px; border-bottom: 1px solid var(--line-2); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal .dh { font-size: 12px; text-transform: uppercase; color: var(--ink-3); text-align: center; padding: 6px 0; font-weight: 600; }
.cal button { aspect-ratio: 1; border: 1px solid var(--line-2); background: #fff; border-radius: 10px; font-size: 14px; font-weight: 500; }
.cal button:hover { border-color: var(--bordeaux); }
.cal button.off { background: var(--nuit); color: var(--ivoire); border-color: var(--nuit); }
.cal button.booked { background: var(--grad); color: #fff; border: 0; }
.cal button.past { opacity: .35; pointer-events: none; }
.cal .blank { visibility: hidden; }
.banner-st { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 16px 20px; border-radius: var(--r); margin-bottom: 22px; }
.banner-st.pending { background: #FFF1DC; color: #6E4200; }
.banner-st.ok { background: #E3F3EA; color: #145A38; }

/* ---------- Tarifs ---------- */
.plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; align-items: stretch; }
.plan { background: var(--card); border-radius: var(--r-lg); padding: 34px 30px; box-shadow: var(--sh); display: flex; flex-direction: column; position: relative; border: 2px solid transparent; }
.plan.pop { border-color: var(--bordeaux); }
.plan .pop-b { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); }
.plan h3 { font-size: 22px; }
.plan .ptag { color: var(--ink-3); font-size: 14.5px; margin-top: 4px; }
.plan .pp { font-family: var(--f-title); font-weight: 800; font-size: 46px; margin: 18px 0 4px; }
.plan .pp small { font-family: var(--f-body); font-size: 15px; font-weight: 400; color: var(--ink-3); }
.plan .com { font-size: 14.5px; color: var(--bordeaux); font-weight: 600; margin-bottom: 20px; }
.plan ul { list-style: none; padding: 0; margin: 0 0 26px; display: grid; gap: 10px; flex: 1; }
.plan li { display: flex; gap: 10px; font-size: 15px; color: var(--ink-2); }
.plan li svg { color: var(--ok); margin-top: 3px; }
.founders { background: var(--nuit); color: var(--ivoire); border-radius: var(--r-lg); padding: 34px 40px; display: flex; gap: 30px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 40px; position: relative; overflow: hidden; }
.founders::after { content: ''; position: absolute; right: -60px; top: -80px; width: 240px; height: 240px; border-radius: 50%; background: var(--grad); opacity: .5; }
.founders > * { position: relative; z-index: 2; }

/* ---------- FAQ ---------- */
.faq-tabs { display: inline-flex; gap: 6px; background: var(--card); padding: 6px; border-radius: var(--r-full); box-shadow: var(--sh); margin-bottom: 30px; }
.faq-tabs button { border: 0; background: none; padding: 10px 22px; border-radius: var(--r-full); font-weight: 600; font-size: 15px; color: var(--ink-2); }
.faq-tabs button.on { background: var(--nuit); color: var(--ivoire); }
.faq details { background: var(--card); border-radius: var(--r); margin-bottom: 12px; box-shadow: var(--sh); }
.faq summary { list-style: none; cursor: pointer; padding: 20px 24px; font-weight: 600; font-size: 16.5px; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary svg { transition: transform .2s; color: var(--bordeaux); }
.faq details[open] summary svg { transform: rotate(45deg); }
.faq details p { margin: 0; padding: 0 24px 22px; color: var(--ink-2); font-weight: 300; }

/* ---------- Modale, lightbox, toast ---------- */
.modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; }
.modal-bg { position: absolute; inset: 0; background: rgba(24,9,13,.7); backdrop-filter: blur(3px); }
.modal-box { position: relative; background: var(--card); border-radius: var(--r-lg); max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 34px; box-shadow: var(--sh-lg); animation: pop .2s ease-out; }
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-x { position: absolute; top: 14px; right: 14px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--ivoire); display: grid; place-items: center; }
.modal-box h2 { font-size: 24px; margin-bottom: 10px; }
.success-ic { width: 70px; height: 70px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; margin-bottom: 18px; }
.success-ic svg { width: 32px; height: 32px; }
.recap { background: var(--ivoire-2); border-radius: var(--r-sm); padding: 16px; display: grid; gap: 6px; font-size: 14.5px; margin: 16px 0; }
.recap div { display: flex; justify-content: space-between; gap: 12px; }
.recap span { color: var(--ink-3); }
.lightbox { position: fixed; inset: 0; z-index: 110; background: rgba(24,9,13,.94); display: grid; place-items: center; padding: 40px; }
.lightbox img { max-height: 84vh; max-width: 92vw; border-radius: 12px; }
.lightbox .lb-x, .lightbox .lb-p, .lightbox .lb-n { position: absolute; border: 0; background: rgba(247,237,226,.12); color: var(--ivoire); width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; }
.lightbox .lb-x { top: 20px; right: 20px; }
.lightbox .lb-p { left: 20px; top: 50%; }
.lightbox .lb-n { right: 20px; top: 50%; }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(120px); background: var(--nuit); color: var(--ivoire); padding: 14px 22px; border-radius: var(--r-full); box-shadow: var(--sh-lg); z-index: 120; font-size: 15px; transition: transform .3s; display: flex; gap: 10px; align-items: center; max-width: 92vw; }
.toast.show { transform: translateX(-50%) translateY(0); }
.loading { display: grid; place-items: center; padding: 120px 0; color: var(--ink-3); }
.spinner { width: 36px; height: 36px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--bordeaux); animation: spin 1s linear infinite; margin-bottom: 14px; }
@keyframes spin { to { transform: rotate(360deg); } }

.pf-actions .btn.on { background: var(--nuit); color: var(--ivoire); border-color: var(--nuit); }
.pf-actions .btn.on svg { fill: var(--corail); color: var(--corail); }
.price-mode { display: flex; flex-wrap: wrap; gap: 4px 22px; margin-bottom: 4px; }
.auth-logo { height: 34px; width: auto; margin-bottom: 26px; }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .nav { display: none; }
  .burger { display: block; }
  .header-right .hide-m { display: none; }
  .track { grid-auto-columns: calc((100% - 2 * 24px) / 3); }
  .why-grid { grid-template-columns: 1fr 1fr; }
  .pf-layout { grid-template-columns: 1fr 340px; gap: 30px; }
}
@media (max-width: 900px) {
  .section { padding: 70px 0; }
  .searchbar { grid-template-columns: 1fr 1fr; border-radius: 18px; }
  .searchbar .sf { border-right: 0; border-bottom: 1px solid var(--line-2); }
  .searchbar .sf:nth-child(odd) { border-right: 1px solid var(--line-2); }
  .searchbar .sf:nth-child(3) { grid-column: 1 / -1; border-right: 0; }
  .searchbar .btn { grid-column: 1 / -1; margin-top: 8px; min-height: 52px; }
  .promises .wrap { grid-template-columns: 1fr 1fr; }
  .promise:nth-child(2) { border-right: 0; }
  .promise:nth-child(-n+2) { border-bottom: 1px solid var(--line-2); }
  .steps, .ev-grid, .blog-grid, .plans { grid-template-columns: 1fr; }
  .ev-card { min-height: 280px; }
  .offer-cols { grid-template-columns: 1fr; gap: 30px; }
  .cta-band .wrap { grid-template-columns: 1fr; }
  .cta-band .ctas { justify-content: flex-start; }
  .foot-top { grid-template-columns: 1fr 1fr; }
  .foot-brand { grid-column: 1 / -1; }
  .two-col { grid-template-columns: 1fr; gap: 30px; }
  .results-layout { grid-template-columns: 1fr; padding-top: 24px; }
  .filters { display: none; position: fixed; inset: 0; top: 0; z-index: 95; max-height: none; border-radius: 0; padding: 24px 22px 100px; }
  .filters.open { display: block; }
  .filters .f-close { display: inline-flex !important; }
  .filters-toggle { display: inline-flex; }
  .filters .f-apply { display: flex !important; position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 22px; background: var(--card); border-top: 1px solid var(--line); }
  .track { grid-auto-columns: calc((100% - 24px) / 2); }
  .pf-layout { grid-template-columns: 1fr; }
  .book-col { display: none; }
  #app:has(.mobile-book) + .site-footer { padding-bottom: 80px; }
  .pf-actions .btn.on { background: var(--nuit); color: var(--ivoire); }
  .mobile-book { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--card); border-top: 1px solid var(--line); padding: 12px 18px; justify-content: space-between; align-items: center; gap: 12px; box-shadow: 0 -8px 24px rgba(53,9,15,.12); }
  .pf-head { flex-direction: column; align-items: flex-start; gap: 14px; margin-top: -70px; }
  .pf-title, .pf-actions { padding-top: 0; }
  .pf-avatar { width: 120px; height: 120px; }
  .pf-title { color: var(--ink); padding-bottom: 0; }
  .pf-tabs { margin-top: 20px; }
  .pf-title .stars { color: var(--ink); }
  .pf-actions { padding-bottom: 0; }
  .pf-title .row { color: var(--ink); }
  .pf-actions .btn { color: var(--nuit); border-color: var(--line); }
  .pf-cover { height: 260px; }
  .info-list { grid-template-columns: 1fr; }
  .rating-sum { grid-template-columns: 1fr; gap: 16px; }
  .crit { grid-template-columns: 130px 1fr 30px; }
  .auth-wrap { grid-template-columns: 1fr; }
  .auth-side { display: none; }
  .dash { grid-template-columns: 1fr; }
  .dash-nav { position: static; grid-auto-flow: column; overflow-x: auto; grid-auto-columns: max-content; }
  .kpis { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 600px) {
  :root { --header-h: 64px; }
  body { font-size: 15.5px; }
  .wrap { padding: 0 18px; }
  .logo img { height: 32px; }
  .header-right .btn { padding: 8px 14px; font-size: 13.5px; }
  .hero-inner { padding-top: 46px; padding-bottom: 56px; }
  .hero-tabs button { padding: 8px 14px; font-size: 13.5px; }
  .searchbar { grid-template-columns: 1fr; }
  .searchbar .sf, .searchbar .sf:nth-child(odd) { border-right: 0; }
  .promise { padding: 24px 12px; }
  .promise .num { font-size: 30px; }
  .track { grid-auto-columns: 78%; }
  .why-grid { grid-template-columns: 1fr; }
  .gallery { grid-template-columns: 1fr 1fr; }
  .videos { grid-template-columns: 1fr; }
  .pf-block { padding: 22px; }
  .form .row2 { grid-template-columns: 1fr; }
  .foot-top { grid-template-columns: 1fr; }
  .photo-slots { grid-template-columns: repeat(3, 1fr); }
  .modal-box { padding: 26px 20px; }
  .founders { padding: 28px 24px; }
}

/* ---------- Ville avec suggestions, vignettes « Autre », vidéos intégrées ---------- */
.ac { position: relative; }
.ac[data-ac-country] input[type=text] { padding-right: 120px; }
.ac-list { position: absolute; left: 0; right: 0; top: calc(100% + 6px); min-width: 250px; background: var(--card); border-radius: 12px; box-shadow: var(--sh-lg); z-index: 45; padding: 6px; max-height: 320px; overflow-y: auto; }
.ac-item { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%; text-align: left; border: 0; background: none; padding: 9px 12px; border-radius: 8px; color: var(--ink); }
.ac-item:hover, .ac-item:focus { background: var(--ivoire); outline: none; }
.ac-item strong { font-size: 14.5px; font-weight: 600; }
.ac-item span { font-size: 12.5px; color: var(--ink-3); }
.ac-empty { padding: 10px 12px; font-size: 14px; color: var(--ink-3); }
.ac-country { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 600; background: var(--ivoire); color: var(--nuit); padding: 4px 10px; border-radius: 999px; pointer-events: none; }
.searchbar .ac-list { top: calc(100% + 16px); left: -18px; right: -18px; }
.filters .ac-list { min-width: 0; }
.chip-other { border-style: dashed; }
.embed { aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #000; margin-top: 14px; }
.embed iframe { width: 100%; height: 100%; border: 0; display: block; }
.video-link { display: block; background: var(--grad); }
.fld input[type=radio], .fld input[type=checkbox] { width: 18px; height: 18px; padding: 0; flex: none; accent-color: var(--bordeaux); }
.price-mode .ck { font-weight: 500; font-size: 14.5px; color: var(--ink); }


/* ---------- v2.5 : offres, vidéos, admin, chatbot, langues ---------- */
.badge-pro { background: var(--nuit); color: var(--ivoire); }
.plan li.inc { font-weight: 600; color: var(--nuit); font-size: 14.5px; }
.vslot { flex-direction: column; gap: 6px; padding: 8px; text-align: center; color: var(--nuit); background: var(--ivoire); border-style: solid; }
.vslot svg { width: 26px; height: 26px; color: var(--bordeaux); fill: var(--bordeaux); }
.photo-slot .vname { font-size: 11.5px; line-height: 1.25; word-break: break-all; color: var(--ink-2); }
.video-file { background: #000; position: relative; }
.video-file video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
.video-file .rm { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgba(24,9,13,.75); color: #fff; border: 0; z-index: 2; }
.adm-head { display: flex; gap: 16px; align-items: flex-start; }
.adm-ph { width: 72px; height: 72px; border-radius: 14px; overflow: hidden; background: var(--grad); flex: none; }
.adm-ph img { width: 100%; height: 100%; object-fit: cover; }
.adm-art select { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
.foot-bottom .version { opacity: .7; }
.chat-fab { position: fixed; right: 22px; bottom: 22px; z-index: 85; display: inline-flex; align-items: center; gap: 10px; padding: 13px 20px; border-radius: 999px; border: 0; background: var(--grad); color: #fff; font-weight: 600; font-size: 15px; box-shadow: 0 12px 30px rgba(177,13,58,.35); }
.chat-fab svg { width: 20px; height: 20px; }
.chat-panel { position: fixed; right: 22px; bottom: 22px; z-index: 86; width: min(380px, calc(100vw - 24px)); height: min(560px, calc(100vh - 110px)); background: var(--card); border-radius: 22px; box-shadow: var(--sh-lg); display: flex; flex-direction: column; overflow: hidden; animation: pop .2s ease-out; }
.chat-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; background: var(--nuit); color: var(--ivoire); }
.chat-head strong { display: block; font-family: var(--f-title); font-weight: 800; font-size: 16px; }
.chat-head span { font-size: 12.5px; opacity: .75; }
.chat-head .modal-x { position: static; background: rgba(247,237,226,.12); color: var(--ivoire); }
.chat-log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--ivoire-2); }
.chat-msg { max-width: 86%; padding: 10px 14px; border-radius: 16px; font-size: 14.5px; line-height: 1.5; }
.chat-msg.bot { background: #fff; color: var(--ink); border-bottom-left-radius: 4px; box-shadow: var(--sh); }
.chat-msg.me { align-self: flex-end; background: var(--nuit); color: var(--ivoire); border-bottom-right-radius: 4px; }
.chat-msg .link { display: inline-block; margin-top: 6px; }
.chat-sugg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chat-sugg .chip { font-size: 13px; padding: 6px 12px; cursor: pointer; }
.chat-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line-2); background: #fff; }
.chat-form input { flex: 1; border: 1.5px solid var(--line); border-radius: 999px; padding: 10px 16px; font-size: 15px; outline: none; }
.chat-form input:focus { border-color: var(--bordeaux); }
.lang-switch { position: relative; }
.lang-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; border: 1px solid rgba(247,237,226,.25); background: none; color: var(--ivoire); font-weight: 600; font-size: 13.5px; }
.lang-menu { position: absolute; right: 0; top: calc(100% + 8px); background: var(--card); color: var(--ink); border-radius: 14px; box-shadow: var(--sh-lg); padding: 6px; min-width: 170px; z-index: 80; display: none; }
.lang-switch:hover .lang-menu, .lang-switch:focus-within .lang-menu { display: block; }
.lang-menu::before { content: ''; position: absolute; top: -10px; left: 0; right: 0; height: 10px; }
.lang-menu a { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 8px; font-size: 14.5px; }
.lang-menu a:hover, .lang-menu a.on { background: var(--ivoire); }
.lang-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.lang-row a { padding: 8px 12px; border-radius: 999px; border: 1px solid rgba(247,237,226,.2); font-size: 14px; }
.lang-row a.on { background: var(--ivoire); color: var(--nuit); }
@media (max-width: 900px) {
  .chat-fab { bottom: 86px; right: 14px; padding: 12px; }
  .chat-fab span { display: none; }
  .chat-panel { right: 12px; bottom: 12px; }
}

/* ---------- v2.6 : grilles responsives, champs obligatoires, garde-fou mobile ---------- */
.steps-4 { grid-template-columns: repeat(4, 1fr); }
.why-3 { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 1100px) { .steps-4, .why-3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { .steps-4, .why-3 { grid-template-columns: 1fr; } }
/* Astérisque automatique sur tout champ obligatoire */
.fld:has(> input[required], > select[required], > textarea[required], > .ac input[required]) > label::after { content: ' *'; color: var(--bordeaux); font-weight: 700; }
.req-note { margin: -4px 0 0; }
/* Garde-fou : aucun élément ne doit élargir la page sur téléphone */
body { overflow-x: clip; }
img, video, iframe { max-width: 100%; }
@media (max-width: 900px) {
  .two-col, .steps, .steps-4, .plans, .ev-grid, .blog-grid, .auth-wrap { grid-template-columns: minmax(0, 1fr); }
}
h1, h2, h3 { overflow-wrap: break-word; }
/* Petits téléphones (320 à 360 px) */
@media (max-width: 360px) {
  .wrap { padding: 0 14px; }
  .site-header .wrap { gap: 8px; }
  .logo img { height: 28px; }
  .header-right { gap: 6px; }
  .header-right .btn { padding: 7px 10px; font-size: 12.5px; }
  .burger { padding: 6px; }
  .plan { padding: 26px 18px; }
  .auth-main { padding: 36px 14px; }
}
.res-head select { max-width: 100%; }
.results-layout > * { min-width: 0; }
@media (max-width: 900px) { .results-layout { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 600px) { .btn { white-space: normal; text-align: center; } }
.res-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; max-width: 100%; }

</style>

<h3>1. Découpez votre journée en moments</h3>
<p>Un mariage compte en général quatre temps musicaux : la <strong>cérémonie</strong> (entrée, échange des vœux, sortie), le <strong>cocktail</strong>, le <strong>dîner</strong> et la <strong>soirée dansante</strong>. Chaque moment appelle une formule différente : un quatuor ou un guitariste-chanteur pour la cérémonie, un duo jazz ou un saxophoniste pour le cocktail, puis un groupe ou un DJ pour la soirée.</p>

proche":"A música aproxima-nos","La page que vous cherchez n'existe pas ou a été déplacée.":"A página que procura não existe ou foi movida.","La recherche, la consultation des profils et les demandes de devis sont gratuites et sans engagement. Lorsque vous réservez, des frais de service sont inclus dans le devis : ils couvrent le paiement sécurisé, la préparation des formalités GUSO et l'accompagnement en cas de problème.":"A pesquisa, a consulta de perfis e os pedidos de orçamento são gratuitos e sem compromisso. Quando reserva, o orçamento inclui uma taxa de serviço: cobre o pagamento seguro, a preparação das formalidades GUSO e o apoio em caso de problema.","La suite":"A seguir","Langue":"Idioma","Langues":"Idiomas","Le GUSO est le guichet qui permet de déclarer un artiste engagé pour un événement en France. Wimbo prépare la déclaration et intègre les cotisations au devis : vous n'avez qu'à valider.":"O GUSO é o balcão que permite declarar um artista contratado para um evento em França. O Wimbo prepara a declaração e inclui as contribuições no orçamento: só tem de validar.","Le GUSO est le guichet qui permet de déclarer un artiste engagé pour un événement occasionnel. C'est obligatoire en France quand vous engagez directement un artiste. Wimbo prépare la déclaration et intègre les cotisations au devis : vous n'avez qu'à valider.":"O GUSO é o balcão que permite declarar um artista contratado para um evento ocasional. É obrigatório em França quando contrata diretamente um artista. O Wimbo prepara a declaração e inclui as contribuições no orçamento: só tem de validar.","Le GUSO, on s'en occupe":"Do GUSO tratamos nós","Le blog Wimbo":"O blog Wimbo","Le coût total dès le devis":"O custo total logo no orçamento","Le jour J, l'artiste fait le show. Le solde est réglé après la prestation, puis vous laissez un avis.":"No grande dia, o artista dá espetáculo. O valor restante é pago após a atuação e, depois, deixa uma avaliação.","Le jour J, place à la musique. Le solde est er nos resultados.","Nous contacter":"Contacte-nos","Nous joindre":"Fale connosco","Nous sélectionnons actuellement des artistes dans cette catégorie. Confiez-nous votre recherche, nous vous proposons des profils sous 24 h.":"Estamos a selecionar artistas nesta categoria. Confie-nos a sua pesquisa: propomos-lhe perfis no prazo de 24 h.","Nous vous envoyons un lien pour choisir un nouveau mot de passe.":"Enviamos-lhe um link para escolher uma nova palavra-passe.","Nouveau":"Novo","Nouveau mot de passe":"Nova palavra-passe","Nouveau mot de passe · Wimbo":"Nova palavra-passe · Wimbo","Nouveau sur Wimbo":"Novo no Wimbo","Nouvelle demande":"Novo pedido","Noël & Nouvel an":"Natal & Ano Novo","Numéro de téléphone incomplet.":"Número de telefone incompleto.","Offert à vie : vous gardez toutes les fonctionnalités Premium, sans abonnement.":"Oferecido para sempre: mantém todas as funcionalidades Premium, sem subscrição.","Offre":"Plano","Offre de lancement":"Oferta de lançamento","Offre gratuite, commission de 15 % par prestation.":"Plano gratuito, comissão de 15 % por atuação.","Offrez-vous un concert privé dans votre salon ou votre jardin : une formule acoustique, conviviale et inoubliable pour vos proches.":"Dê-se ao luxo de um concerto privado na sua sala ou no seu jardim: um formato acústico, convivial e inesquecível para os seus mais próximos.","On s'occupe du reste":"Nós tratamos do resto","On vous attend sur scène":"Esperamos por si em palco","Options":"Opções","Organisateur":"Organizador","Organisateur : cliquez sur « Se connecter » puis « Je cherche un artiste ». Artiste : cliquez sur « Je suis artiste ». Les deux sont gratuits et prennent quelques minutes.":"Organizador: clique em «Iniciar sessão» e depois em «Procuro um artista». Artista: clique em «Sou artista». Ambos são gratuitos e demoram poucos minutos.","Organisateurs":"Organizadores","Organiser une fête au pays à distance : le guide diaspora":"Organizar uma festa na terra à distância: o guia da diáspora","Organiste":"Organista","Orgue":"Órgão","Oui : choisissez la langue avec le drapeau en haut de page (français, portugais ou anglais). Les présentations des artistes restent dans la langue où ils les ont rédigées.":"Sim: escolha o idioma com a bandeira no topo da página (francês, português ou inglês). As apresentações dos artistas mantêm-se no idioma em que foram escritas.","Oui : choisissez le français, le portugais ou l'anglais avec le drapeau en haut de page.":"Sim: escolha francês, português ou inglês com a bandeira no topo da página.","Oui, Wimbo n'a pas de frontières : vous pouvez réserver un artiste près de chez vous ou pour une fête au pays, et tout gérer à distance.":"Sim, o Wimbo não tem fronteiras: pode reservar um artista perto de si ou para uma festa na terra, e gerir tudo à distância.","Oui, c'est l'une des spécialités de Wimbo : une fête de famille au Portugal, aux Antilles, en Afrique ou ailleurs. Les échanges et le paiement se font en ligne, et nos artistes ont l'habitude des familles qui organisent à distance.":"Sim, é uma das especialidades do Wimbo: uma festa de família em Portugal, nas Antilhas, em África ou noutro lugar. A comunicação e o pagamento são feitos online, e os nossos artistas estão habituados a famílias que organizam à distância.","Oui, vous restez libre d'accepter ou de refuser chaque demande, et de proposer un devis adapté. Un taux de réponse élevé améliore toutefois votre visibilité.":"Sim, é livre de aceitar ou recusar cada pedido e de propor um orçamento adequado. No entanto, uma taxa de resposta elevada melhora a sua visibilidade.","Oui. Chaque avis est relu par notre équipe et rapproché d'une réservation réelle avant d'être publié sur le profil de l'artiste.":"Sim. Cada avaliação é revista pela nossa equipa e associada a uma reserva real antes de ser publicada no perfil do artista.","Oui. Créer votre profil et recevoir des demandes est gratuit. Une commission n'est prélevée que sur les prestations réalisées. Les 150 premiers art  cachets et demandez un devis en quelques clics. Nous préparons la déclaration GUSO et sécurisons le paiement.":"Procura um artista de {genre} para um casamento, uma festa privada ou um evento empresarial? Descubra perfis verificados, ouça os seus excertos, compare os cachets e peça um orçamento em poucos cliques. Preparamos a declaração GUSO e garantimos a segurança do pagamento.","Vous recevrez une réponse à <strong>{email}</strong>, en général sous {time}.":"Receberá uma resposta em <strong>{email}</strong>, normalmente no prazo de {time}.","dès {price}":"desde {price}","l'artiste":"o artista","membre fondateur":"membro fundador","pour {event}":"para {event}","sur {n} avis":"em {n} avaliações","tarif sur mesure":"preço à medida","{cat} · {read} de lecture":"{cat} · {read} de leitura","{city} et {n} km autour":"{city} e {n} km em redor","{instrument} pour votre événement":"{instrument} para o seu evento","{n} artiste":"{n} artista","{n} artiste disponible":"{n} artista disponível","{n} artistes":"{n} artistas","{n} artistes disponibles":"{n} artistas disponíveis","{n} avis":"{n} avaliações","{n} avis vérifié":"{n} avaliação verificada","{n} avis vérifiés":"{n} avaliações verificadas","{n} demandes de devis":"{n} pedidos de orçamento","{n} invités":"{n} convidados","{n} photo(s)":"{n} foto(s)","{n} événements":"{n} eventos","À partir de {price}":"A partir de {price}","Étape {n} sur 3":"Passo {n} de 3","à {place}":"em {place}","{n} avis#1":"{n} avaliação"},"blog":{"choisir-musicien-mariage":{"title":"Música de casamento: o guia para escolher o seu artista","excerpt":"Cerimónia, cocktail, jantar, festa: que artista para cada momento, com que orçamento e com quanta antecedência reservar?","body":"<p>A música é uma das recordações mais marcantes de um casamento. Bem escolhida, acompanha a emoção da cerimónia, descontrai o ambiente do cocktail e põe todas as gerações a dançar. Eis como proceder, passo a passo.</p>\n<h3>1. Divida o seu dia em momentos</h3>\n<p>Um casamento tem geralmente quatro momentos musicais: a <strong>cerimónia</strong> (entrada, troca de votos, saída), o <strong>cocktail</strong>, o <strong>jantar</strong> e a <strong>festa dançante</strong>. Cada momento pede um formato diferente: um quarteto ou um guitarrista-cantor para a cerimónia, um duo de jazz ou um saxofonista para o cocktail e, depois, uma banda ou um DJ para a festa.</p>\n<h3>2. Escolha a formação adequada ao seu espaço</h3>\n<p>Uma quinta ao ar livre sem eletricidade? Prefira um formato acústico. Uma grande sala com 200 convidados? Será necessária uma sonorização adequada, que a maioria das bandas fornece. Verifique sempre o espaço necessário indicado no perfil do artista.</p>\n<h3>3. Defina um orçamento realista</h3>\n<p>A título indicativo, conte com 400 a 900 € para um músico a solo, 900 a 1800 € para um trio e 1500 a 3500 € para uma banda completa, consoante a duração, a data e a deslocação. No Wimbo, cada perfil apresenta um intervalo de cachet e o orçamento detalha as contribuições sociais, sem surpresas desagradáveis.</p>\n<h3>4. Reserve cedo</h3>\n<p>Os sábados de maio a setembro esgotam depressa: reserve com 8 a 12 meses de antecedência para os artistas mais procurados. Para um casamento fora de época, 3 a 6 meses costumam bastar.</p>\n<h3>5. As perguntas certas a fazer</h3>\n<ul><li>Que músicas se podem acrescentar ao repertório, e com que antecedência?</li><li>Que pausas estão previstas durante a atuação?</li><li>O que acontece se o artista tiver um impedimento?</li><li>O equipamento (som, luzes, microfone para os discursos) está incluído?</li></ul>\n<h3>6. Não se esqueça da parte administrativa</h3>\n<p>Em França, contratar um artista para um evento privado implica uma declaração junto do GUSO. No Wimbo, preparamo-la por si e o pagamento fica protegido até ao grande dia. Só lhe resta aproveitar.</p>"},"guso-tout-comprendre":{"title":"GUSO: tudo o que precisa de saber em 5 minutos","excerpt":"Vai contratar um músico para uma festa privada? Saiba o que é o GUSO, porque é obrigatório e como o Wimbo trata disso por si.","body":"<p>O <strong>GUSO</strong> (Guichet unique du spectacle occasionnel, o balcão único para espetáculos ocasionais) é o serviço público que permite aos organizadores ocasionais declarar e remunerar legalmente artistas de espetáculos ao vivo. Abrange particulares, associações e empresas cuja atividade principal não é o espetáculo.</p>\n<h3>Porque é obrigatório?</h3>\n<p>Em França, presume-se que um artista que atua em público é trabalhador por conta de outrem (artigo L7121-3 do Código do Trabalho francês). Quando o contrata diretamente para o seu casamento ou o seu aniversário, torna-se, portanto, a sua entidade empregadora ocasional e tem de declarar a atuação e pagar as contribuições sociais correspondentes.</p>\n<h3>Como funciona o GUSO?</h3>\n<p>Uma única declaração, a <strong>DUS</strong> (déclaration unique et simplifiée, ou seja, declaração única e simplificada), substitui todas as formalidades: vale como contrato de trabalho e como declaração junto dos organismos sociais (URSSAF, reforma, subsídio de desemprego, férias pagas do setor do espetáculo, formação, saúde no trabalho). O GUSO calcula as contribuições e redistribui-as.</p>\n<h3>Pontos a reter</h3>\n<ul><li>O recurso ao GUSO está limitado a <strong>6 representações por ano</strong> para um mesmo organizador.</li><li>A declaração deve ser feita, idealmente, antes da atuação e, o mais tardar, nos dias seguintes.</li><li>As contribuições somam-se ao cachet líquido do artista: tenha isso em conta no seu orçamento.</li><li>Se o artista lhe faturar através de uma estrutura (associação, produtora), é essa estrutura a entidade empregadora: não precisa de recorrer ao GUSO.</li></ul>\n<h3>O que o Wimbo faz</h3>\n<p>No Wimbo, o orçamento que recebe inclui as contribuições: fica a saber o custo total desde o início. Assim que a reserva é confirmada, preparamos a declaração com os seus dados e os do artista; só tem de a validar. Sem esquecimentos, sem risco de penalizações.</p>\n<p class=\"note\">Este artigo é informativo e não substitui aconselhamento jurídico. Para casos específicos, consulte <a href=\"https://www.guso.fr\" target=\"_blank\" rel=\"noopener\">guso.fr</a>.</p>"},"prix-musicien-evenement":{"title":"Quanto custa um músico para um evento privado?","excerpt":"Solo, duo, banda ou DJ: os intervalos de preços praticados e os critérios que fazem variar o orçamento.","body":"<p>É a primeira pergunta que todos fazem. O cachet de um artista depende de muitos critérios, mas algumas referências ajudam a ver as coisas com clareza.</p>\n<h3>Os intervalos indicativos</h3>\n<ul><li><strong>Músico ou cantor a solo</strong>: 400 a 900 €</li><li><strong>Duo</strong>: 600 a 1300 €</li><li><strong>Trio ou quarteto</strong>: 900 a 2400 €</li><li><strong>Banda de 4 a 6 músicos</strong>: 1500 a 3500 €</li><li><strong>DJ</strong>: 500 a 1600 €</li></ul>\n<p>Estes valores correspondem a uma atuação de 2 a 4 horas e são meramente indicativos.</p>\n<h3>O que faz variar o preço</h3>\n<ul><li><strong>A data</strong>: um sábado de junho custa mais do que uma quinta-feira de novembro.</li><li><strong>A duração</strong>: só a cerimónia, o cocktail ou a festa completa até altas horas.</li><li><strong>A deslocação</strong>: distância, portagens, eventual alojamento.</li><li><strong>O equipamento</strong>: sonorização, luzes, microfone para os discursos.</li><li><strong>Os pedidos especiais</strong>: aprendizagem de novos temas, coreografia, traje temático.</li></ul>\n<h3>Como evitar surpresas desagradáveis</h3>\n<p>Peça um orçamento detalhado que especifique a duração, as pausas, o equipamento e os custos adicionais. No Wimbo, o orçamento inclui também as contribuições sociais associadas ao GUSO, que muitos se esquecem de prever. O pagamento é feito em duas vezes: um sinal de 30 % para garantir a data e o valor restante após a atuação.</p>"},"organiser-fete-au-pays":{"title":"Organizar uma festa na terra à distância: o guia da diáspora","excerpt":"Casamento em Portugal, batizado em Guadalupe, aniversário em Lisboa: como encontrar e reservar um artista local sem lá estar.","body":"<p>Vive em França e a sua família está em Portugal, nas Antilhas ou em África? Organizar uma festa lá a partir de Paris ou de Lyon é muitas vezes uma dor de cabeça: encontrar prestadores de serviços de confiança, fazer-se entender, pagar à distância. Eis os nossos conselhos.</p>\n<h3>1. Comece pela música</h3>\n<p>O espaço e o catering encontram-se muitas vezes através da família. Já os artistas reservam-se cedo e são mais difíceis de avaliar sem os ver. No Wimbo, cada perfil apresenta fotos, vídeos e avaliações verificadas: pode comparar a partir do seu sofá.</p>\n<h3>2. Pense na mistura de culturas</h3>\n<p>Um casamento franco-português ou franco-antilhano reúne muitas vezes várias gerações e várias línguas. Procure um artista capaz de passar da música de variedades francesa para a kizomba, o fado ou o zouk. Indique-o no seu pedido de orçamento.</p>\n<h3>3. Fale por videochamada antes de reservar</h3>\n<p>Uma chamada de 20 minutos com o artista permite validar o repertório, os horários e a logística. O sistema de mensagens do Wimbo guarda todas as suas conversas no mesmo sítio.</p>\n<h3>4. Proteja o pagamento</h3>\n<p>Evite transferências para o estrangeiro sem garantia. Com o Wimbo, o seu sinal fica protegido e o valor restante só é pago ao artista após a atuação.</p>\n<h3>5. Designe uma pessoa de contacto no local</h3>\n<p>Um primo ou uma amiga pode receber o artista no grande dia. Partilhe com essa pessoa o resumo da reserva: horários, contacto, mapa de acesso.</p>"}},"chatk":[["preco","precos","custa","custo","quanto","orcamento","caro","valor"],["guso","declaracao","declarar","contribuicoes","seguranca","social"],["registar","registo","inscrever","inscricao","criar","conta","perfil"],["palavra","passe","senha","esqueci","sessao","entrar","login"],["cancelar","cancelamento","reembolso","r
